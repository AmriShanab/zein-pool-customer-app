name: zain_pool_customer_app
description: "Zein's Pool - Customer Booking & Pool Experience App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  uuid: ^4.6.0
  intl: ^0.20.2
  connectivity_plus: ^7.3.2
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  payhere_mobilesdk_flutter: ^3.2.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

